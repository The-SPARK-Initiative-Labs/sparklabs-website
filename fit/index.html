<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171B2E">
<meta name="robots" content="noindex, nofollow">
<title>8-Week Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#171B2E; --paper:#F1F0F6; --card:#FFFFFF;
  --violet:#4A38DC; --violet-soft:#E8E4FF; --violet-deep:#2E1FA6;
  --teal:#12866B; --teal-soft:#D9F0E8;
  --muted:#6C7185; --line:#DFDDE8;
  --disp:"Barlow Condensed",Impact,sans-serif;
  --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.5;padding-bottom:64px;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* ---------- masthead ---------- */
.top{background:var(--ink);color:#fff;padding:26px 0 20px;padding-top:calc(26px + env(safe-area-inset-top))}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9BA0C0;margin:0 0 6px}
h1{font-family:var(--disp);font-weight:700;font-size:44px;line-height:.94;letter-spacing:-.01em;margin:0 0 4px;text-transform:uppercase}
.dates{font-family:var(--mono);font-size:12px;color:#9BA0C0;margin:0 0 20px}

/* ---------- the block: 56 dots ---------- */
.block{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:0 0 14px}
.pip{aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.11);transition:background .25s,transform .25s}
.pip.rest{background:rgba(255,255,255,.05)}
.pip.done{background:#5CE0B8}
.pip.today{box-shadow:inset 0 0 0 2px #fff}
.pip.pop{transform:scale(1.35)}
.tally{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:12px;color:#9BA0C0}
.tally b{color:#5CE0B8;font-weight:600}

.jump{display:block;width:100%;margin:16px 0 0;padding:13px;border:0;border-radius:10px;
  background:var(--violet);color:#fff;font-family:var(--disp);font-size:19px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.jump:active{background:var(--violet-deep)}

/* ---------- weeks ---------- */
.week{margin:20px 0 0}
.wk-head{display:flex;align-items:baseline;gap:10px;padding:0 2px 8px;border-bottom:2px solid var(--ink)}
.wk-num{font-family:var(--disp);font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.wk-range{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-left:auto}

/* ---------- day cards ---------- */
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
.day.is-today{border-color:var(--violet);box-shadow:0 0 0 2px var(--violet-soft)}
.day.is-rest{background:transparent;border-style:dashed}
.day.is-done .d-title{color:var(--teal)}

.d-head{display:flex;align-items:center;gap:12px;width:100%;padding:14px;background:none;border:0;
  font:inherit;color:inherit;text-align:left;cursor:pointer;min-height:56px}
.d-dow{font-family:var(--disp);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);width:30px;flex:none;padding-top:2px}
.day.is-today .d-dow{color:var(--violet)}
.d-mid{flex:1;min-width:0}
.d-title{font-family:var(--disp);font-size:23px;font-weight:700;line-height:1.05;text-transform:uppercase;letter-spacing:.005em}
.d-sub{font-size:13px;color:var(--muted);margin-top:1px}
.d-right{flex:none;display:flex;align-items:center;gap:9px}
.mins{font-family:var(--mono);font-size:11px;color:var(--muted)}
.chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
  transform:rotate(45deg);transition:transform .2s;margin-bottom:3px}
.day.open .chev{transform:rotate(-135deg);margin-bottom:-3px}
.badge{width:20px;height:20px;border-radius:50%;background:var(--teal);flex:none;position:relative}
.badge::after{content:"";position:absolute;left:6.5px;top:3.5px;width:5px;height:9px;
  border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(42deg)}

.d-body{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.day.open .d-body{display:block}

.grp{margin-top:14px}
.grp-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:2px}

.row{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.box{width:26px;height:26px;flex:none;border:2px solid var(--line);border-radius:7px;background:#fff;
  position:relative;transition:background .15s,border-color .15s;margin-top:1px}
.row.on .box{background:var(--teal);border-color:var(--teal)}
.row.on .box::after{content:"";position:absolute;left:8px;top:4px;width:6px;height:11px;
  border-right:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(42deg)}
.r-mid{flex:1;min-width:0}
.r-name{font-size:15px;font-weight:500;line-height:1.3}
.row.on .r-name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.r-hint{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.r-val{font-family:var(--mono);font-size:16px;font-weight:600;flex:none;padding-top:2px;
  font-variant-numeric:tabular-nums}

.rule{font-size:12.5px;color:var(--muted);background:var(--violet-soft);border-radius:8px;
  padding:9px 11px;margin-top:14px;line-height:1.45}
.rule b{color:var(--violet-deep);font-weight:600}

/* ---------- log ---------- */
.log{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.log-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.sc{aspect-ratio:1;min-height:32px;border:1px solid var(--line);background:#fff;border-radius:6px;
  font-family:var(--mono);font-size:12px;color:var(--muted);cursor:pointer;padding:0}
.sc.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
textarea{width:100%;margin-top:9px;padding:10px;border:1px solid var(--line);border-radius:8px;
  font:inherit;font-size:14px;resize:vertical;min-height:52px;background:#fff;color:var(--ink)}
textarea:focus,.sc:focus-visible,.box:focus-visible,.d-head:focus-visible,.jump:focus-visible{
  outline:2px solid var(--violet);outline-offset:2px}

/* ---------- everyday bookends ---------- */
.bookend{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:8px 0}
.bookend .grp-h{border:0;padding:0;margin-bottom:7px}
.bookend p{margin:0;font-size:14px;line-height:1.55;color:var(--muted)}
.bookend b{color:var(--ink);font-weight:600}
.bk-h{font-family:var(--disp);font-size:19px;font-weight:700;text-transform:uppercase;
  letter-spacing:.02em;color:var(--ink);margin:14px 0 2px}
.bk-h:first-of-type{margin-top:4px}
.bk-note{font-size:12.5px;color:var(--muted);margin:0 0 6px}
.bk{list-style:none;margin:0;padding:0}
.bk li{font-size:14px;line-height:1.5;color:var(--muted);padding:8px 0;border-bottom:1px solid var(--line)}
.bk li:last-child{border-bottom:0}
.bk li b{display:block;color:var(--ink);font-weight:600;font-size:14.5px;margin-bottom:1px}
.bk .amt{font-family:var(--mono);font-size:12px;color:var(--violet-deep);font-weight:600}

.close{margin:34px 0 10px;padding:18px;background:var(--ink);color:#fff;border-radius:12px}
.close h2{font-family:var(--disp);font-size:26px;font-weight:700;text-transform:uppercase;margin:0 0 7px}
.close p{margin:0;font-size:14.5px;line-height:1.55;color:#C6C9DC}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <p class="eyebrow">Bodyweight &middot; Strength + Conditioning</p>
    <h1>The 8-Week<br>Block</h1>
    <p class="dates" id="dates"></p>
    <div class="block" id="block" aria-hidden="true"></div>
    <div class="tally"><span id="tally"></span><span id="pct"></span></div>
    <button class="jump" id="jump">Go to today</button>
  </div>
</header>

<main class="wrap" id="app"></main>

<div class="wrap">
  <div class="close">
    <h2>When the block is done</h2>
    <p>Scroll back through your ratings. Whatever you kept marking 7 and up is the part worth building on &mdash; run the block again from Week 5's numbers, add a fifth day, point the running at a 5K, or start adding weight.</p>
  </div>
</div>

const KEY="block8";
let S={};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const get=d=>S[d]||(S[d]={c:{},f:0,n:""});

const TODAY=new Date().toISOString().slice(0,10);
const allDays=WEEKS.flatMap(w=>w.days);
const active=allDays.filter(d=>d.blocks);
const dayEls={};

function total(d){return d.blocks?d.blocks.reduce((n,b)=>n+b.items.length,0)+2:0}
function count(d){const c=get(d.date).c;return Object.values(c).filter(Boolean).length}
function isDone(d){return !!d.blocks && count(d)===total(d)}

const blockEl=document.getElementById("block");
allDays.forEach(d=>{
  const p=document.createElement("div");
  p.className="pip"+(d.blocks?"":" rest")+(d.date===TODAY?" today":"");
  blockEl.appendChild(p);d._pip=p;
});
function refreshTop(){
  let n=0;
  allDays.forEach(d=>{const y=isDone(d);if(y)n++;d._pip.classList.toggle("done",y)});
  document.getElementById("tally").innerHTML="<b>"+n+"</b> of "+active.length+" sessions logged";
  document.getElementById("pct").textContent=Math.round(n/active.length*100)+"%";
}
document.getElementById("dates").textContent=
  new Date(WEEKS[0].start+"T12:00").toDateString().slice(4)+"  \u2192  "+
  new Date(allDays[allDays.length-1].date+"T12:00").toDateString().slice(4);

const app=document.getElementById("app");
WEEKS.forEach(w=>{
  const sec=document.createElement("section");sec.className="week";
  sec.innerHTML='<div class="wk-head"><span class="wk-num">Week '+w.n+'</span><span class="wk-range">'+w.range+'</span></div>';
  w.days.forEach(d=>sec.appendChild(dayCard(d)));
  if(w.n===1)sec.appendChild(bookends());
  app.appendChild(sec);
});

function bookends(){
  const el=document.createElement("div");el.className="bookend";
  el.innerHTML='<div class="grp-h">Every session, both ends</div>'
   +'<div class="bk-h">Warm up</div>'
   +'<p class="bk-note">About 6 minutes. Go straight through with no rest \u2014 you want to feel warm and slightly out of breath by the end.</p>'
   +'<ul class="bk">'
   +'<li><b>Jog in place</b>Light and easy, on the balls of your feet. <span class="amt">60 sec</span></li>'
   +'<li><b>Leg swings</b>Hold a wall for balance. Swing one leg forward and back like a pendulum, keeping your torso still. Then face the wall and swing the same leg side to side across your body. Switch legs. <span class="amt">10 each direction, each leg</span></li>'
   +'<li><b>Slow squats</b>Feet shoulder-width, sit back like there\'s a chair behind you, chest up. Take about 3 seconds to go down. <span class="amt">10 reps</span></li>'
   +'<li><b>Arm circles</b>Arms straight out to the sides, draw big circles forward, then reverse. <span class="amt">10 each way</span></li>'
   +'<li><b>Walking lunges with a twist</b>Step forward into a lunge until both knees are near 90&deg;. While you\'re down there, twist your upper body toward the front leg. Stand, step through with the other leg. <span class="amt">8 total steps</span></li>'
   +'<li><b>Inchworms</b>Stand, bend at the hips and put your hands on the floor (bend your knees as much as you need). Walk your hands out until you\'re in a push-up position, then walk your feet up to your hands. Stand up. That\'s one. <span class="amt">5 reps</span></li>'
   +'<li><b>Jumping jacks</b><span class="amt">20 reps</span></li>'
   +'</ul>'
   +'<div class="bk-h">Cool down</div>'
   +'<p class="bk-note">About 5 minutes. Hold each stretch 30 seconds \u2014 that means each side, where there are two. Stretch to mild tension, never to pain, and keep breathing instead of holding your breath.</p>'
   +'<ul class="bk">'
   +'<li><b>Quads</b>Stand and hold a wall for balance. Grab one ankle behind you and pull your heel toward your butt, knee pointing down at the floor. Switch legs.</li>'
   +'<li><b>Hamstrings</b>Sit on the floor with one leg straight out and the other knee bent, foot tucked in. Reach toward the straight foot until you feel it down the back of that thigh. Switch legs.</li>'
   +'<li><b>Calves</b>Hands flat on a wall, one foot back about two feet. Keep that back leg straight and press its heel into the floor, then lean toward the wall. Switch legs.</li>'
   +'<li><b>Glutes (figure four)</b>Lie on your back. Cross your right ankle over your left knee so your legs make a number 4. Reach through the gap, grab behind your left thigh, and pull it toward your chest. Switch sides.</li>'
   +'<li><b>Chest</b>Stand in a doorway. Put one forearm flat against the frame with your elbow about shoulder height, then step forward gently until you feel it across the front of your shoulder and chest. Switch arms.</li>'
   +'<li><b>Child\'s pose</b>Kneel down, sit back on your heels, walk your hands forward along the floor and let your forehead rest down. Hold 30\u201360 seconds and breathe.</li>'
   +'</ul>';
  return el;
}

function row(d,id,name,val,hint){
  const st=get(d.date);
  const r=document.createElement("div");
  r.className="row"+(st.c[id]?" on":"");
  r.setAttribute("role","checkbox");r.tabIndex=0;
  r.setAttribute("aria-checked",st.c[id]?"true":"false");
  r.innerHTML='<span class="box"></span><span class="r-mid"><span class="r-name">'+name+'</span>'
    +(hint?'<span class="r-hint">'+hint+'</span>':'')+'</span>'
    +(val?'<span class="r-val">'+val+'</span>':'');
  const flip=()=>{
    const s=get(d.date);s.c[id]=!s.c[id];save();
    r.classList.toggle("on",!!s.c[id]);
    r.setAttribute("aria-checked",s.c[id]?"true":"false");
    dayEls[d.date].classList.toggle("is-done",isDone(d));
    d._pip.classList.add("pop");setTimeout(()=>d._pip.classList.remove("pop"),260);
    refreshTop();
  };
  r.addEventListener("click",flip);
  r.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}});
  return r;
}

function dayCard(d){
  const el=document.createElement("article");
  el.className="day"+(d.blocks?"":" is-rest")+(d.date===TODAY?" is-today":"");
  dayEls[d.date]=el;

  const head=document.createElement("button");
  head.className="d-head";head.type="button";
  head.innerHTML='<span class="d-dow">'+d.dow+'</span>'
    +'<span class="d-mid"><span class="d-title">'+d.title+'</span><span class="d-sub">'+d.sub+'</span></span>'
    +'<span class="d-right">'+(d.mins?'<span class="mins">'+d.mins+'m</span>':'')
    +(d.blocks?'<span class="chev"></span>':'')+'</span>';
  el.appendChild(head);
  if(!d.blocks)return el;

  head.addEventListener("click",()=>el.classList.toggle("open"));
  if(d.date===TODAY)el.classList.add("open");

  const body=document.createElement("div");body.className="d-body";
  const st=get(d.date);

  d.blocks.forEach((b,bi)=>{
    const g=document.createElement("div");g.className="grp";
    g.innerHTML='<div class="grp-h">'+b.h+'</div>';
    b.items.forEach((it,ii)=>g.appendChild(row(d,bi+"-"+ii,it.n,it.v,it.h)));
    body.appendChild(g);
  });

  const wu=document.createElement("div");wu.className="grp";
  wu.innerHTML='<div class="grp-h">Bookends</div>';
  wu.appendChild(row(d,"wu","Warm-up","6:00","the full sequence is up under Week 1"));
  wu.appendChild(row(d,"cd","Cool-down","5:00","stretches, 30 sec each"));
  body.appendChild(wu);

  if(d.kind==="strength"){
    const r=document.createElement("div");r.className="rule";
    r.innerHTML="<b>If the last round felt easy</b> \u2014 like you had 3+ more reps in you \u2014 add a rep or two next time and write it down. If your form breaks, that set is over, whatever the number says.";
    body.appendChild(r);
  }
  if(d.kind==="run"){
    const r=document.createElement("div");r.className="rule";
    r.innerHTML="<b>Easy means easy.</b> You should be able to talk in full sentences the whole time. Going too hard on this day is the fastest way to stall out.";
    body.appendChild(r);
  }

  const log=document.createElement("div");log.className="log";
  log.innerHTML='<div class="log-h">How it felt</div>';
  const scale=document.createElement("div");scale.className="scale";
  for(let i=1;i<=10;i++){
    const b=document.createElement("button");b.type="button";b.className="sc"+(st.f===i?" on":"");
    b.textContent=i;
    b.addEventListener("click",()=>{
      const s=get(d.date);s.f=(s.f===i?0:i);save();
      scale.querySelectorAll(".sc").forEach((x,j)=>x.classList.toggle("on",s.f===j+1));
    });
    scale.appendChild(b);
  }
  log.appendChild(scale);
  const ta=document.createElement("textarea");
  ta.placeholder="Notes \u2014 what you actually hit, what felt hard\u2026";ta.value=st.n||"";
  ta.addEventListener("input",()=>{get(d.date).n=ta.value;save()});
  log.appendChild(ta);
  body.appendChild(log);

  el.appendChild(body);
  el.classList.toggle("is-done",isDone(d));
  return el;
}

document.getElementById("jump").addEventListener("click",()=>{
  let t=dayEls[TODAY];
  if(!t){const nxt=allDays.find(d=>d.date>=TODAY)||allDays[0];t=dayEls[nxt.date]}
  t.classList.add("open");
  t.scrollIntoView({behavior:"smooth",block:"center"});
});

refreshTop();
if(dayEls[TODAY])setTimeout(()=>dayEls[TODAY].scrollIntoView({block:"center"}),60);
</script>
