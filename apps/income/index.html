<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="description" content="Real work income — payroll + ATM deposits — plus a live delivery pocket.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Real Income</title>
<style>
  /* Sibling of Change Maker: same palette + type, focused one-screen tool. */
  :root{
    --bg:#eef1f5; --surface:#ffffff; --surface-2:#f3f6fa;
    --fg:#101a28; --muted:#5c6b7e; --border:#d7dee7;
    --accent:#0b5fb0; --accent-fg:#ffffff;
    --income:#0e8a52; --income-fg:#ffffff;    /* confirmed money */
    --pocket:#b26a00; --pocket-fg:#ffffff;     /* cash in pocket, not deposited */
    --chip-bg:#eaf1fb; --chip-fg:#0b3a6b; --chip-border:#cfe0f6;
    --focus:#0b5fb0;
    --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0b0f14; --surface:#151c25; --surface-2:#1b2430;
      --fg:#eef3f9; --muted:#95a3b4; --border:#28323f;
      --accent:#4a9bee; --accent-fg:#06121f;
      --income:#1ba667; --income-fg:#04140c;
      --pocket:#e8a13a; --pocket-fg:#1a1203;
      --chip-bg:#16293f; --chip-fg:#bcd8f7; --chip-border:#244a73;
      --focus:#4a9bee; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b0f14; --surface:#151c25; --surface-2:#1b2430;
    --fg:#eef3f9; --muted:#95a3b4; --border:#28323f;
    --accent:#4a9bee; --accent-fg:#06121f;
    --income:#1ba667; --income-fg:#04140c;
    --pocket:#e8a13a; --pocket-fg:#1a1203;
    --chip-bg:#16293f; --chip-fg:#bcd8f7; --chip-border:#244a73;
    --focus:#4a9bee; color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);-webkit-text-size-adjust:100%;
       padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .wrap{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:20px;
        display:flex;flex-direction:column;gap:16px}

  header{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  header h1{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
  header a.back{font-size:.85rem;font-weight:600;color:var(--muted);text-decoration:none}
  header a.back:active{color:var(--fg)}

  /* confirmed hero */
  .hero{background:var(--income);color:var(--income-fg);border-radius:16px;padding:18px 16px;text-align:center}
  .hero .lbl{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
  .hero .amt{font-size:clamp(2.6rem,15vw,3.8rem);font-weight:800;line-height:1.02;
             font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:2px;font-family:var(--font-mono)}
  .hero .sub{font-size:.9rem;font-weight:600;margin-top:4px;opacity:.92}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 14px}
  .tile .k{font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .tile .v{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;font-family:var(--font-mono);margin-top:3px}
  .tile .n{font-size:.78rem;color:var(--muted);margin-top:1px}

  .statline{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;
            font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .statline b{color:var(--fg)}

  .divider{display:flex;align-items:center;gap:10px;color:var(--muted);
           font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
  .divider::before,.divider::after{content:"";height:1px;background:var(--border);flex:1}

  /* pocket */
  .pocket{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;
          display:flex;flex-direction:column;gap:14px}
  .pocket .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .pocket .top .lbl{font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .pocket .top .big{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;font-family:var(--font-mono);color:var(--pocket)}

  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .inp{position:relative;display:flex;align-items:center}
  .inp span{position:absolute;left:14px;font-size:1.4rem;font-weight:700;color:var(--muted);pointer-events:none}
  input[type=text]{width:100%;font-family:var(--font-ui);font-size:1.6rem;font-weight:700;
    font-variant-numeric:tabular-nums;padding:12px 14px 12px 34px;background:var(--surface-2);color:var(--fg);
    border:2px solid var(--border);border-radius:12px;outline:none}
  input[type=text]:focus{border-color:var(--focus)}
  input::placeholder{color:var(--muted);opacity:.55;font-weight:600}

  .add{width:100%;font-family:var(--font-ui);font-size:1rem;font-weight:800;padding:13px 12px;border-radius:12px;
       cursor:pointer;border:2px solid var(--income);background:var(--income);color:var(--income-fg)}
  .add:disabled{opacity:.45;cursor:not-allowed}
  button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

  .entries{display:flex;flex-direction:column;gap:7px}
  .entry{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);
         border-radius:11px;padding:9px 12px}
  .entry .t{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:62px}
  .entry .tip{font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums;font-family:var(--font-mono)}
  .entry .x{margin-left:auto;background:none;border:none;color:var(--muted);font-size:1.3rem;line-height:1;
            cursor:pointer;padding:2px 6px;border-radius:8px}
  .entry .x:active{background:var(--border)}
  .empty{color:var(--muted);font-size:.86rem;text-align:center;padding:4px 0}

  .pocketbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pbtn{font-family:var(--font-ui);font-size:.92rem;font-weight:700;padding:12px 10px;border-radius:11px;cursor:pointer;
        border:2px solid var(--border);background:transparent;color:var(--fg)}
  .pbtn.primary{border-color:var(--pocket);background:var(--pocket);color:var(--pocket-fg)}
  .pbtn:disabled{opacity:.4;cursor:not-allowed}

  /* history */
  details.hist{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
  details.hist>summary{list-style:none;cursor:pointer;padding:15px 16px;display:flex;align-items:center;gap:8px;
    font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  details.hist>summary::-webkit-details-marker{display:none}
  details.hist>summary .cnt{color:var(--fg);font-variant-numeric:tabular-nums}
  details.hist>summary .chev{margin-left:auto;transition:transform .15s ease;font-size:1rem}
  details.hist[open]>summary .chev{transform:rotate(180deg)}
  .histbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
  .histday{border:1px solid var(--border);border-radius:12px;padding:11px 12px;background:var(--surface-2)}
  .histday .dh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .histday .dh .d{font-weight:800;font-size:.95rem}
  .histday .dh .tot{font-weight:800;font-variant-numeric:tabular-nums;font-family:var(--font-mono);color:var(--income)}
  .histday .items{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .histday .it{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;
    background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px 10px}

  footer{color:var(--muted);font-size:.76rem;text-align:center;line-height:1.5}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Real Income</h1>
    <a class="back" href="../">‹ Apps</a>
  </header>

  <!-- CONFIRMED (bank) -->
  <div class="hero">
    <div class="lbl">Real income to date</div>
    <div class="amt" id="total">$0.00</div>
    <div class="sub" id="asof">payroll + ATM deposits only</div>
  </div>

  <div class="tiles">
    <div class="tile">
      <div class="k">Wages</div>
      <div class="v" id="wages">$0.00</div>
      <div class="n" id="wagesN">paychecks</div>
    </div>
    <div class="tile">
      <div class="k">Tips</div>
      <div class="v" id="tips">$0.00</div>
      <div class="n" id="tipsN">ATM deposits</div>
    </div>
  </div>

  <div class="statline" id="statline"></div>

  <div class="divider">In your pocket</div>

  <!-- POCKET (live, local) -->
  <div class="pocket">
    <div class="top">
      <div class="lbl">Logged, not yet deposited</div>
      <div class="big" id="pocket">$0.00</div>
    </div>

    <div class="field">
      <label for="tipIn">Tip amount</label>
      <div class="inp"><span>$</span><input id="tipIn" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off"></div>
    </div>
    <button class="add" id="addBtn" type="button" disabled>+ Log this delivery</button>

    <div class="entries" id="entries"></div>

    <div class="pocketbtns">
      <button class="pbtn primary" id="depositBtn" type="button" disabled>Mark all deposited</button>
      <button class="pbtn" id="clearBtn" type="button" disabled>Clear log</button>
    </div>
  </div>

  <!-- HISTORY -->
  <details class="hist" id="histWrap">
    <summary>Past deliveries <span class="cnt" id="histCount"></span><span class="chev">⌄</span></summary>
    <div class="histbody" id="histBody"></div>
  </details>

  <footer>
    Confirmed numbers update when Cairn pulls your bank each week.<br>
    Your pocket and history live on this phone.
  </footer>
</div>

<script>
(function(){
  // ---- CONFIRMED (bank-scraped; Cairn updates these each week) ----
  var CONFIRMED = {
    asof:   "2026-10-11",
    wages:  596.37, wagesCount: 2,
    tips:   531.00, tipsCount: 12,
    perWeek: 300, perShift: 35, splitWages: 56
  };

  var $=function(id){return document.getElementById(id);};
  function money(n){ return '$'+(Math.round(n*100)/100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
  function fmtDate(iso){ var p=iso.split('-'); return p[1]+'/'+p[2]; }
  function time12(d){ var hh=d.getHours(),mm=('0'+d.getMinutes()).slice(-2),ap=hh>=12?'PM':'AM',h=hh%12; if(h===0)h=12; return h+':'+mm+' '+ap; }
  function dayKey(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function dayLabel(d){
    var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    return days[d.getDay()]+' '+(d.getMonth()+1)+'/'+d.getDate();
  }

  // paint confirmed
  var realTotal = CONFIRMED.wages + CONFIRMED.tips;
  $('total').textContent = money(realTotal);
  $('asof').textContent = 'payroll + ATM deposits · through ' + fmtDate(CONFIRMED.asof);
  $('wages').textContent = money(CONFIRMED.wages);
  $('wagesN').textContent = CONFIRMED.wagesCount + ' paycheck' + (CONFIRMED.wagesCount===1?'':'s');
  $('tips').textContent = money(CONFIRMED.tips);
  $('tipsN').textContent = CONFIRMED.tipsCount + ' deposit' + (CONFIRMED.tipsCount===1?'':'s');
  $('statline').innerHTML =
    '<span>~<b>'+money(CONFIRMED.perWeek)+'</b>/wk</span>'+
    '<span>~<b>'+money(CONFIRMED.perShift)+'</b>/shift</span>'+
    '<span><b>'+CONFIRMED.splitWages+'%</b> wages / '+(100-CONFIRMED.splitWages)+'% tips</span>';

  // ---- STORAGE ----
  var KEY='realincome.pocket.v1';       // current, not-yet-deposited
  var KEY_H='realincome.history.v1';    // deposited / past deliveries
  function load(k){ try{ var r=localStorage.getItem(k); return r?(JSON.parse(r)||[]):[]; }catch(e){ return []; } }
  function store(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  var pocket=load(KEY);
  var history=load(KEY_H);

  var tipIn=$('tipIn'), addBtn=$('addBtn'),
      entries=$('entries'), pocketEl=$('pocket'),
      depositBtn=$('depositBtn'), clearBtn=$('clearBtn'),
      histBody=$('histBody'), histCount=$('histCount');

  function num(el){ var r=(el.value||'').replace(/[^0-9.]/g,''); if(r===''||r==='.') return null; var v=parseFloat(r); return isNaN(v)?null:v; }

  function renderPocket(){
    var sum=0; for(var i=0;i<pocket.length;i++) sum+=pocket[i].tip;
    pocketEl.textContent=money(sum);
    if(pocket.length===0){
      entries.innerHTML='<div class="empty">No deliveries logged yet.</div>';
    } else {
      entries.innerHTML='';
      for(var j=pocket.length-1;j>=0;j--){
        var e=pocket[j];
        var row=document.createElement('div'); row.className='entry';
        row.innerHTML='<span class="t">'+time12(new Date(e.ts))+'</span>'+
                      '<span class="tip">'+money(e.tip)+'</span>'+
                      '<button class="x" data-i="'+j+'" aria-label="Remove">×</button>';
        entries.appendChild(row);
      }
    }
    depositBtn.disabled=(pocket.length===0);
    clearBtn.disabled=(pocket.length===0);
  }

  function renderHistory(){
    if(history.length===0){
      histCount.textContent='(none yet)';
      histBody.innerHTML='<div class="empty">Deposited deliveries show up here.</div>';
      return;
    }
    // group by the day the delivery was logged
    var groups={}; var order=[];
    for(var i=0;i<history.length;i++){
      var h=history[i]; var d=new Date(h.ts); var k=dayKey(d);
      if(!groups[k]){ groups[k]={label:dayLabel(d), ts:d.getTime(), items:[], total:0}; order.push(k); }
      groups[k].items.push(h); groups[k].total+=h.tip;
    }
    order.sort(function(a,b){ return groups[b].ts-groups[a].ts; });
    var totalAll=0, n=history.length;
    for(var z=0;z<history.length;z++) totalAll+=history[z].tip;
    histCount.textContent='('+n+' · '+money(totalAll)+')';
    histBody.innerHTML='';
    for(var g=0;g<order.length;g++){
      var grp=groups[order[g]];
      var blk=document.createElement('div'); blk.className='histday';
      var chips='';
      // newest tip first within the day
      var its=grp.items.slice().sort(function(a,b){ return b.ts-a.ts; });
      for(var m=0;m<its.length;m++){ chips+='<span class="it">'+money(its[m].tip)+'</span>'; }
      blk.innerHTML='<div class="dh"><span class="d">'+grp.label+'</span><span class="tot">'+money(grp.total)+'</span></div>'+
                    '<div class="items">'+chips+'</div>';
      histBody.appendChild(blk);
    }
  }

  function refreshAddBtn(){ addBtn.disabled=(num(tipIn)===null); }

  addBtn.addEventListener('click',function(){
    var tip=num(tipIn); if(tip===null) return;
    pocket.push({ts:Date.now(), tip:tip});
    store(KEY,pocket); renderPocket();
    tipIn.value=''; refreshAddBtn(); tipIn.focus();
  });

  entries.addEventListener('click',function(ev){
    var b=ev.target.closest('.x'); if(!b) return;
    var i=parseInt(b.getAttribute('data-i'),10);
    if(!isNaN(i)){ pocket.splice(i,1); store(KEY,pocket); renderPocket(); }
  });

  depositBtn.addEventListener('click',function(){
    if(pocket.length===0) return;
    if(confirm('Mark these as deposited? They move to Past deliveries and will match your ATM deposits on the next bank pull.')){
      var now=Date.now();
      for(var i=0;i<pocket.length;i++){ pocket[i].deposited=now; history.push(pocket[i]); }
      pocket=[]; store(KEY,pocket); store(KEY_H,history);
      renderPocket(); renderHistory();
    }
  });
  clearBtn.addEventListener('click',function(){
    if(pocket.length===0) return;
    if(confirm('Delete these without depositing? (Use this only for mistakes — they will NOT be saved to history.)')){
      pocket=[]; store(KEY,pocket); renderPocket();
    }
  });

  tipIn.addEventListener('input',refreshAddBtn);
  tipIn.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); if(!addBtn.disabled) addBtn.click(); }});

  // hand-off / shortcut hook: ?tip=12.50 prefills; &add=1 logs it immediately
  try{
    var q=new URLSearchParams(location.search);
    if(q.get('tip')){
      tipIn.value=q.get('tip'); refreshAddBtn();
      if(q.get('add')==='1' && !addBtn.disabled){ addBtn.click(); }
    }
  }catch(e){}

  renderPocket(); renderHistory(); refreshAddBtn();

  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
})();
</script>
</body>
</html>
