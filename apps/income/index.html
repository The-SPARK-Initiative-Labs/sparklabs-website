<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f14">
<title>Real Income — moved</title>
<meta http-equiv="refresh" content="1;url=https://hub.sparkinitiative.io/">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
 font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:#0b0f14;color:#eef3f9;text-align:center;padding:24px}
a{color:#39d98a;font-weight:700;text-decoration:none}
.m{color:#8ea0b5}
</style>
</head>
<body>
<div>
  <p style="font-size:1.2rem;font-weight:700;margin:0 0 6px">Real Income moved</p>
  <p class="m" style="margin:0 0 16px">Taking you to the live app…</p>
  <p><a id="go" href="https://hub.sparkinitiative.io/">Open it now →</a></p>
</div>
<script>
// Clean up the old PWA/service worker so nobody gets stuck on the cached page.
(async function(){
  try{
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      for(const r of regs){ try{ await r.unregister(); }catch(e){} }
    }
    if(window.caches){ const ks = await caches.keys(); for(const k of ks){ try{ await caches.delete(k); }catch(e){} } }
  }catch(e){}
  location.replace('https://hub.sparkinitiative.io/');
})();
</script>
</body>
</html>
